name: 柠檬猫桌面应用构建

# 2026-07-20：柠檬猫桌面应用跨平台构建
# - Windows runner 产出 .exe (NSIS installer)
# - macOS runner 产出 zip 仅（x64 + arm64），不产 dmg
# 原因：GitHub Actions arm64 runner + 中文 productName + hdiutil detach 
# 存在已知 bug（hdiutil 卸载 /Volumes/柠檬猫 0.1.0 一定挂）。
# dmg 不存在后，hdiutil 整个不参与 build，问题消失。
# 代价：macOS 用户下载后双击 zip 解压，要手动拖 app 进 Applications。
# - 不签名（用户当前不需要发布给别人）
# - 触发条件：push 到 main、PR、manual
# - 产出：上传为 GitHub Actions artifact（14 天保留）

on:
  push:
    branches: [main]
    paths:
      - "app-shell/**"
      - ".github/workflows/build-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "app-shell/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台（默认两个都跑）"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos

jobs:
  build:
    name: 构建桌面应用 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 按 lock 安装依赖
        working-directory: app-shell
        run: npm ci --no-audit --no-fund

      - name: 构建桌面应用（Windows）
        if: matrix.os == 'windows-latest' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows')
        working-directory: app-shell
        run: npm run build:app:win
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: 构建桌面应用（macOS，仅 zip）
        if: matrix.os == 'macos-latest' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos')
        working-directory: app-shell
        run: npm run build:app:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: 上传 Windows 安装包
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: 柠檬猫-Windows-Setup
          path: app-shell/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: 上传 macOS 安装包（仅 zip）
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: 柠檬猫-macOS
          path: app-shell/dist/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: 打印产物清单
        if: always()
        shell: pwsh
        working-directory: app-shell
        run: |
          echo "===== 构建产物 ====="
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse | Format-Table Name, Length, LastWriteTime -AutoSize
          } else {
            echo "dist 目录不存在（构建未产出）"
          }
          echo "===================="
