name: 柠檬猫桌面应用构建

# 2026-07-20：柠檬猫桌面应用跨平台构建
# - Windows runner 产出 .exe (NSIS installer)
# - macOS runner 产出 .dmg + zip (x64 + arm64)
# - 不签名（用户当前不需要发布给别人）
# - 触发条件：push 到 main、PR、manual
# - 产出：上传为 GitHub Actions artifact（14 天保留）

on:
  push:
    branches: [main]
    paths:
      - "app-shell/**"
      - ".github/workflows/build-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "app-shell/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台（默认两个都跑）"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos

jobs:
  build:
    name: 构建桌面应用 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 2026-07-21：升 Node 22（官方弃用 Node 20，下次升级强制 24）；
      # 不用 npm cache，因为仓库里没有 package-lock.json，先 install 一次生成。
      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖（首次自动生成 package-lock.json）
        working-directory: app-shell
        run: npm install --no-audit --no-fund

      - name: 构建桌面应用（Windows）
        if: matrix.os == 'windows-latest' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows')
        working-directory: app-shell
        run: npm run build:app:win
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      # 2026-07-21：清理上一个 build 残留的 volume（避免 hdiutil detach 失败）
      - name: 清理 macOS 残留挂载
        if: matrix.os == 'macos-latest'
        run: |
          echo "===== 当前挂载的 dmg 相关卷 ====="
          mount | grep -i "柠檬猫\|lemon-cat" || echo "（无残留）"
          for vol in $(mount | grep -i "柠檬猫\|lemon-cat" | awk '{print $3}'); do
            echo "尝试卸载 $vol"
            hdiutil detach "$vol" 2>&1 || true
          done
          echo "===== 清理完毕 ====="

      - name: 构建桌面应用（macOS）
        if: matrix.os == 'macos-latest' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos')
        working-directory: app-shell
        run: npm run build:app:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: 上传 Windows 安装包
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: 柠檬猫-Windows-Setup
          path: app-shell/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: 上传 macOS 安装包（dmg + zip）
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: 柠檬猫-macOS
          path: |
            app-shell/dist/*.dmg
            app-shell/dist/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: 打印产物清单
        if: always()
        shell: pwsh
        working-directory: app-shell
        run: |
          echo "===== 构建产物 ====="
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse | Format-Table Name, Length, LastWriteTime -AutoSize
          } else {
            echo "dist 目录不存在（构建未产出）"
          }
          echo "===================="
