name: lemoncat-1a
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: lemon
      POSTGRES_DB: lemon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run service:setup}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - lemon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemon -d lemon"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  lemon_pg:
