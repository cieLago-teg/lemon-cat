<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>🎬 完整动图浏览器 · Tororo 白猫 · 9 动作全对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d1117; color: #eee; font-family: "Cascadia Code", "Consolas", monospace; padding: 16px; }
    h1 { color: #06d6a0; font-size: 18px; margin: 0 0 4px; }
    .sub { color: #9eb6d3; font-size: 12px; margin-bottom: 12px; line-height: 1.6; }
    .info { background: #161b22; border: 1px solid #30363d; padding: 10px 14px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; line-height: 1.6; }
    .info b { color: #ffd166; }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; max-width: 720px; margin: 0 auto; }
    .panel h3 { margin: 0 0 8px; color: #76a8ff; font-size: 14px; }
    .canvas-wrap { width: 100%; height: 560px; background: #0a0e14; border-radius: 6px; overflow: hidden; position: relative; }
    .canvas-wrap canvas { display: block; }
    .motion-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .motion-btn { padding: 8px 4px; background: #21262d; border: 1px solid #30363d; color: #eee; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: inherit; transition: all 0.15s; }
    .motion-btn:hover { background: #2d333b; border-color: #76a8ff; }
    .motion-btn.playing { background: #06d6a0; color: #0d1117; border-color: #06d6a0; font-weight: 700; }
    .motion-btn .file { display: block; color: #9eb6d3; font-size: 9px; margin-top: 2px; }
    .motion-btn.playing .file { color: rgba(0,0,0,0.6); }
    .auto-row { display: flex; gap: 6px; margin-top: 8px; }
    .auto-row button { flex: 1; padding: 6px; background: #161b22; border: 1px solid #30363d; color: #eee; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: inherit; }
    .auto-row button:hover { background: #21262d; }
    .auto-row button.active { background: #ef476f; border-color: #ef476f; }
    .current-mtn { color: #ffd166; font-size: 11px; margin-top: 6px; min-height: 16px; }
    .cat-status { font-size: 10px; color: #9eb6d3; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>🎬 完整动图浏览器 · Tororo 白猫</h1>
  <div class="sub">点任意动作按钮 → 播放对应 .mtn 动图。配合"零件命名工作台"（atlas-naming-ui.html）使用，看动作就知道哪个 PARTS_01_xxx 是哪个部位。</div>

  <div class="info">
    💡 <b>使用技巧</b>：每个动作都会调动不同零件。<br>
    例如：<code>00_idle</code> = 呼吸/微动，<code>01</code> ≈ 点头，<code>07</code> ≈ 全身甩，<code>08</code> ≈ 头部偏转。<br>
    看不出来的点几下 <b>🔄 循环</b>，对照零件命名工作台就能锁定位置。
  </div>

  <div class="panel">
    <h3>🐱 Tororo 白猫（只保留这一只）</h3>
    <div class="canvas-wrap" id="wrap-tororo"><canvas id="cv-tororo"></canvas></div>
    <div class="motion-list" id="motions-tororo"></div>
    <div class="auto-row">
      <button onclick="autoCycle('tororo')">🔄 循环播放</button>
      <button onclick="stopAll('tororo')">⏹ 停止</button>
    </div>
    <div class="current-mtn" id="current-tororo">— 未播放 —</div>
    <div class="cat-status" id="status-tororo">⏳ 加载中…</div>
  </div>

  <script src="./lib/live2d.min.js"></script>
  <script src="./lib/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/index.min.js"></script>

  <script>
    const MTN_FILES = [
      { id: '00_idle', name: '00 待机·呼吸',  emoji: '😴', hint: '几乎不动，最容易对照' },
      { id: '01',      name: '01 动作 1',     emoji: '👋', hint: '随机' },
      { id: '02',      name: '02 动作 2',     emoji: '👋', hint: '随机' },
      { id: '03',      name: '03 动作 3',     emoji: '👋', hint: '随机' },
      { id: '04',      name: '04 动作 4',     emoji: '👋', hint: '随机' },
      { id: '05',      name: '05 动作 5',     emoji: '👋', hint: '随机' },
      { id: '06',      name: '06 动作 6',     emoji: '👋', hint: '随机' },
      { id: '07',      name: '07 动作 7',     emoji: '👋', hint: '随机' },
      { id: '08',      name: '08 动作 8',     emoji: '👋', hint: '随机' },
    ];

    // ✨ 关键：从已知的 atlas_region_map.json 拿 60 个贴图零件的真实 bbox 并集
    // 这就是猫"在画布上的实际占用区域"。用它来算缩放，猫才能显示全身。
    async function fetchCatBbox(modelKey) {
      const r = await fetch(`/models/free-cats/${modelKey}/moc/${modelKey}.atlas_region_map.json`);
      const data = await r.json();
      let minX = 1e9, minY = 1e9, maxX = 0, maxY = 0;
      for (const b of data.blocks) {
        const { x, y, w, h } = b.bbox;
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x + w > maxX) maxX = x + w;
        if (y + h > maxY) maxY = y + h;
      }
      return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    const cats = {};
    let autoTimers = { tororo: null };

    async function loadCat(catKey, modelKey, name) {
      const wrap = document.getElementById(`wrap-${catKey}`);
      const canvas = document.getElementById(`cv-${catKey}`);
      const statusEl = document.getElementById(`status-${catKey}`);

      // 0. 等一帧让 CSS 把 wrap 撑开
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      const sw = wrap.clientWidth;
      const sh = wrap.clientHeight;

      // 1. 先算猫的真实 bbox（异步）
      const catBox = await fetchCatBbox(modelKey);

      const app = new PIXI.Application({
        view: canvas,
        width: sw,
        height: sh,
        backgroundColor: 0x0a0e14,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
      });
      const model = await PIXI.live2d.Live2DModel.from(`/models/free-cats/${modelKey}/${modelKey}.model.json`);

      // 2. ✨ 用猫的真实 bbox（不是整个 model.width × model.height）算缩放
      const scale = Math.min(sw / catBox.w, sh / catBox.h) * 0.95;
      model.scale.set(scale);

      // 3. 居中到画布中央（基于猫的视觉中心）
      model.x = (sw - catBox.w * scale) / 2 - catBox.x * scale;
      model.y = (sh - catBox.h * scale) / 2 - catBox.y * scale;

      app.stage.addChild(model);

      cats[catKey] = { app, model, motionMgr: model.internalModel?.motionManager };
      statusEl.innerHTML = `✅ ${name} 加载成功 · 猫占用 ${catBox.w}×${catBox.h} · ${MTN_FILES.length} 个动作可用`;
      statusEl.style.color = '#06d6a0';

      // 渲染动作按钮
      const list = document.getElementById(`motions-${catKey}`);
      list.innerHTML = '';
      MTN_FILES.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'motion-btn';
        btn.id = `${catKey}-${m.id}`;
        btn.innerHTML = `${m.emoji} ${m.name}<span class="file">${m.id}.mtn · ${m.hint}</span>`;
        btn.onclick = () => playMotion(catKey, m.id);
        list.appendChild(btn);
      });
    }

    function playMotion(catKey, mtnId) {
      const c = cats[catKey];
      if (!c) return;
      MTN_FILES.forEach(m => {
        const b = document.getElementById(`${catKey}-${m.id}`);
        if (b) b.classList.toggle('playing', m.id === mtnId);
      });
      const cur = document.getElementById(`current-${catKey}`);
      cur.textContent = `▶ 播放 ${mtnId}.mtn`;
      const group = mtnId === '00_idle' ? 'idle' : '';
      try {
        if (c.motionMgr?.startMotion) {
          const defs = c.motionMgr.definitions[group] || [];
          const def = defs.find(d => d.file && d.file.endsWith(`${mtnId}.mtn`)) || defs[0];
          if (def) {
            c.motionMgr.startMotion(def, 1);
          } else {
            c.motionMgr.startRandomMotion(group, 1);
          }
        }
      } catch (e) {
        console.warn(`播放 ${mtnId} 失败`, e);
      }
    }

    function autoCycle(catKey) {
      stopAll(catKey);
      let i = 0;
      autoTimers[catKey] = setInterval(() => {
        playMotion(catKey, MTN_FILES[i].id);
        i = (i + 1) % MTN_FILES.length;
      }, 3500);
      playMotion(catKey, MTN_FILES[0].id);
    }

    function stopAll(catKey) {
      if (autoTimers[catKey]) {
        clearInterval(autoTimers[catKey]);
        autoTimers[catKey] = null;
      }
      const c = cats[catKey];
      if (c?.motionMgr?.stopAllMotions) c.motionMgr.stopAllMotions();
      MTN_FILES.forEach(m => {
        const b = document.getElementById(`${catKey}-${m.id}`);
        if (b) b.classList.remove('playing');
      });
      const cur = document.getElementById(`current-${catKey}`);
      cur.textContent = '— 已停止 —';
    }

    (async () => {
      await loadCat('tororo', 'tororo', '白猫');
      setTimeout(() => playMotion('tororo', '00_idle'), 800);
    })();
  </script>
</body>
</html>
